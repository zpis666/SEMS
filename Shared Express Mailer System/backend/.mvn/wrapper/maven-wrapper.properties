# Maven Wrapper 配置（Maven Wrapper 3.3.4 / only-script 模式）
# 本机未安装 Maven，构建一律通过工程内的 mvnw / mvnw.cmd 完成；
# 换机后无需安装 Maven，Wrapper 会按下面的 distributionUrl 自行下载并解包。
#
# distributionUrl 于 2026-10-06 改用阿里云公共仓库地址（Apache 官方站在国内很慢）：
#   https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
# 注意：settings.xml 的镜像只作用于「依赖」下载，管不到「下载 Maven 本体」这一步，故必须在这里改。
#
# 依赖下载源走本机全局配置 C:\Users\Admin1\.m2\settings.xml（阿里云公共仓库），不随仓库提交。
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
